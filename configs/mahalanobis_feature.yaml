project:
  name: retinal_faf_ood_gatekeeper
  run_name: mahalanobis_feature
  seed: 42

data:
  root_dir: data
  train_manifest: data/manifests/train_synthetic_faf.csv
  val_manifest: data/manifests/val_synthetic_faf.csv
  test_id_manifest: data/manifests/test_real_id.csv
  test_ood_manifest: data/manifests/test_ood.csv
  image_size: 224
  grayscale_to_rgb: true
  normalize: imagenet
  batch_size: 16

model:
  name: mahalanobis_feature
  backbone: resnet50
  pretrained: true
  layers: [layer3]
  covariance_regularization: 0.001
  device: auto

output:
  runs_dir: runs
  save_heatmaps: false
